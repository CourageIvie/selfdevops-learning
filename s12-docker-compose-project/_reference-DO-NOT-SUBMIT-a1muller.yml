

services:

  # ── Backing Services ──────────────────────────────────────────────────────

  catalog-db:
    image: mariadb:10.9
    container_name: a1muller-project01-catalog-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: sampledb
      MYSQL_USER: catalog_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - catalog-db-data:/var/lib/mysql
    networks:
      - retail-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  orders-db:
    image: mariadb:10.9
    container_name: a1muller-project01-orders-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: orders
      MYSQL_USER: orders_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - orders-db-data:/var/lib/mysql
    networks:
      - retail-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  carts-db:
    image: amazon/dynamodb-local:1.20.0
    container_name: a1muller-project01-carts-db
    networks:
      - retail-net
    restart: on-failure

  checkout-redis:
    image: redis:6-alpine
    container_name: a1muller-project01-checkout-redis
    networks:
      - retail-net
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    container_name: a1muller-project01-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - retail-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  # ── Application Services ──────────────────────────────────────────────────

  catalog:
    build:
      context: ./src/catalog
      dockerfile: Dockerfile
      args:
        MAIN_PATH: main.go
    image: retail-store-catalog:local
    container_name: a1muller-project01-catalog
    environment:
      GIN_MODE: release
      DB_ENDPOINT: catalog-db:3306
      DB_NAME: sampledb
      DB_USER: catalog_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_MIGRATE: "true"
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - retail-net
    restart: on-failure

  carts:
    build:
      context: ./src/cart
      dockerfile: Dockerfile
      args:
        JAR_PATH: target/carts-0.0.1-SNAPSHOT.jar
    image: retail-store-carts:local
    container_name: a1muller-project01-carts
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: dynamodb
      CARTS_DYNAMODB_ENDPOINT: http://carts-db:8000
      CARTS_DYNAMODB_CREATETABLE: "true"
      AWS_ACCESS_KEY_ID: key
      AWS_SECRET_ACCESS_KEY: dummy
    depends_on:
      - carts-db
    networks:
      - retail-net
    restart: on-failure

  orders:
    build:
      context: ./src/orders
      dockerfile: Dockerfile
      args:
        JAR_PATH: target/orders-0.0.1-SNAPSHOT.jar
    image: retail-store-orders:local
    container_name: a1muller-project01-orders
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: mysql,rabbitmq
      SPRING_DATASOURCE_WRITER_URL: jdbc:mariadb://orders-db:3306/orders
      SPRING_DATASOURCE_WRITER_USERNAME: orders_user
      SPRING_DATASOURCE_WRITER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_READER_URL: jdbc:mariadb://orders-db:3306/orders
      SPRING_DATASOURCE_READER_USERNAME: orders_user
      SPRING_DATASOURCE_READER_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - retail-net
    restart: on-failure

  checkout:
    build:
      context: ./src/checkout
      dockerfile: Dockerfile
    image: retail-store-checkout:local
    container_name: a1muller-project01-checkout
    environment:
      REDIS_URL: redis://checkout-redis:6379
      ENDPOINTS_ORDERS: http://orders:8080
    depends_on:
      - checkout-redis
      - orders
    networks:
      - retail-net
    restart: on-failure

  assets:
    build:
      context: ./src/assets
      dockerfile: Dockerfile
    image: retail-store-assets:local
    container_name: a1muller-project01-assets
    environment:
      PORT: "8080"
    networks:
      - retail-net
    restart: on-failure

  # ── Frontend ──────────────────────────────────────────────────────────────

  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
      args:
        JAR_PATH: target/ui-0.0.1-SNAPSHOT.jar
    image: retail-store-ui:local
    container_name: a1muller-project01-ui
    ports:
      - "8888:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom"
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
      ENDPOINTS_CATALOG: http://catalog:8080
      ENDPOINTS_CARTS: http://carts:8080
      ENDPOINTS_ORDERS: http://orders:8080
      ENDPOINTS_CHECKOUT: http://checkout:8080
      ENDPOINTS_ASSETS: http://assets:8080
    depends_on:
      - catalog
      - carts
      - orders
      - checkout
      - assets
    networks:
      - retail-net
    restart: on-failure

networks:
  retail-net:

volumes:
  catalog-db-data:
  orders-db-data:
